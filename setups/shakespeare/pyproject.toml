[project]
name = "ambidex-shakespeare"
version = "0.1.0"
description = "Character-level language modeling on Tiny Shakespeare, CPU, fixed time budget"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "psutil>=5.9",
    "torch>=2.5",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
